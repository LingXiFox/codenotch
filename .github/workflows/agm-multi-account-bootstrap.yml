name: AGM multi-account bootstrap

on:
  push:
    branches:
      - feature/antigravity-multi-account

permissions:
  contents: write

jobs:
  test-build:
    if: ${{ !contains(github.event.head_commit.message, '[agm-bootstrap]') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify integration is present
        run: |
          grep -q "private let agmProfiles" Sources/App/AppDelegate.swift
          grep -q "actor AGMAntigravityProvider" Sources/Providers/AGMAntigravityProvider.swift
          grep -q "AGMBridgeTests" Tests/AGMBridgeTests.swift

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test and build app
        id: build
        continue-on-error: true
        run: |
          set +e
          {
            echo "== toolchain =="
            xcodebuild -version
            xcrun --show-sdk-version
            echo "== tests =="
            make test-ci
            TEST_STATUS=$?
            echo "== release build =="
            make build-ci
            BUILD_STATUS=$?
            echo "TEST_STATUS=$TEST_STATUS"
            echo "BUILD_STATUS=$BUILD_STATUS"
            exit $(( TEST_STATUS || BUILD_STATUS ))
          } > agm-bootstrap.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Package app bundle
        if: steps.build.outputs.status == '0'
        run: |
          APP=$(find build/ci -type d -name 'Codenotch.app' -print -quit)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/ci/Codenotch.app.zip
          make dmg-ci

      - name: Record bootstrap result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATUS="FAIL"
          if [ "${{ steps.build.outputs.status }}" = "0" ]; then STATUS="PASS"; fi
          {
            echo "# AGM multi-account bootstrap: $STATUS"
            echo
            echo "Validated commit: ${GITHUB_SHA}"
            echo
            echo
            tail -n 200 agm-bootstrap.log 2>/dev/null || true
          } > AGM_BOOTSTRAP_STATUS.md
          git add AGM_BOOTSTRAP_STATUS.md
          git commit -m "Record AGM bootstrap $STATUS [agm-bootstrap]" || true
          git push origin HEAD:feature/antigravity-multi-account

      - uses: actions/upload-artifact@v7
        if: steps.build.outputs.status == '0'
        with:
          name: Codenotch-AGM-multi-account-${{ github.sha }}
          path: |
            build/ci/Codenotch.app.zip
            build/ci/*.dmg
          if-no-files-found: error

      - name: Fail workflow when validation failed
        if: steps.build.outputs.status != '0'
        run: exit 1
